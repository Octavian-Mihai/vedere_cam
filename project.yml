name: VedereCam
options:
  bundleIdPrefix: com.octa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  VedereCam:
    type: application
    platform: iOS
    sources: [VedereCam/Sources]
    info:
      path: VedereCam/Info.plist
      properties:
        NSCameraUsageDescription: Capture RAW photos with your chosen look.
        NSPhotoLibraryAddUsageDescription: Save your photos to the Photos library.
        NSPhotoLibraryUsageDescription: Import photos to apply looks.
        UILaunchScreen: {}
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  VedereCamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VedereCam/Tests]
    dependencies:
      - target: VedereCam
